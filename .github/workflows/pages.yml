# Prüft alle Inhalte (sympy + Gegenprobe der App-Logik) und veröffentlicht app/ auf GitHub Pages.
# Schlägt eine Prüfung fehl, wird nichts veröffentlicht.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install sympy pyyaml
      - run: python tools/build.py
      - run: node tools/test_mathe.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
