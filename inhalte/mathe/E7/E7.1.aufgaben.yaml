- id: E7.1-001
  typ: term
  stufe: 1
  frage: Gib eine **Stammfunktion** F von `f(x) = x^3` an.
  form: stammfunktion
  loesung: 0,25x^4
  stammfunktion_von: x^3
  tipps:
  - 'Stammfunktion: Ableiten rückwärts. Probe: F′ muss f ergeben.'
  - '`xⁿ` → `xⁿ⁺¹/(n + 1)`: Hochzahl um 1 erhöhen, durch die neue Hochzahl dividieren.'
  - Eine Konstante + C darfst du dazuschreiben, musst aber nicht.
  fehler:
  - antwort: 3x^2
    hinweis: Das ist die Ableitung. Gesucht ist umgekehrt eine Funktion, deren Ableitung f ist.
