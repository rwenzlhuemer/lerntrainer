  frage: Berechne die Fläche zwischen den Graphen von `f(x) = -x^2 - 5x - 4` und `g(x) = -x - 1`.
  loesung: 4/3
  flaeche:
    term: -x^2 - 4x - 3
    von: -3
    bis: -1
  graph:
    x:
    - -5
    - 1
    y:
    - -9
    - 9
