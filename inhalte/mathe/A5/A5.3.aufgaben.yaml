- id: A5.3-001
  typ: zahl
  stufe: 1
  frage: Der Preis ändert sich von 200 € auf 220 €. Um wie viel Prozent hat sich der Wert geändert? (Abnahme mit Minus.)
  loesung: '10'
  weg:
  - '(220 - 200) : 200 · 100 = 10'
  einheit: '%'
  rechnung: '(220 - 200) : 200 · 100'
  tipps:
  - 'Relative Änderung = (neu − alt) : alt.'
  - Die absolute Änderung ist `20`. Teile durch den **alten** Wert 200.
  - Mal 100 ergibt Prozent.
  fehler:
  - antwort: 100/11
    hinweis: Geteilt wird durch den **alten** Wert, nicht durch den neuen.
  - antwort: '20'
    hinweis: Das ist die absolute Änderung. Gefragt sind Prozent.
