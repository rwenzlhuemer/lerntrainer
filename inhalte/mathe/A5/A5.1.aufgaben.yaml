- id: A5.1-001
  typ: zahl
  stufe: 1
  frage: Wie viel Prozent sind 150 € von 300 €?
  loesung: '50'
  weg:
  - '150 : 300 · 100 = 50'
  einheit: '%'
  rechnung: '150 : 300 · 100'
