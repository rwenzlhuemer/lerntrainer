- id: B5.5-001
  typ: auswahl
  stufe: 1
  frage: Wie viele reelle Lösungen hat `x² + 5x + 4 = 0`?
  optionen: &id001
  - zwei reelle Lösungen
  - genau eine reelle Lösung
  - keine reelle Lösung
  richtig:
  - 0
  pruefung:
    art: q_anzahl
    gleichung: x² + 5x + 4 = 0
  erklaerung: Die Diskriminante ist `b² - 4ac = 9`. Die Diskriminante ist **positiv** – unter der Wurzel steht eine positive Zahl, plus und minus geben zwei Lösungen.
  tipps:
  - 'Berechne nur den Teil unter der Wurzel: die Diskriminante `D = b² - 4ac`.'
  - 'Hier: a = 1, b = 5, c = 4.'
