- id: E1.4-011
  typ: zahl
  stufe: 3
  frage: Ein Körper bewegt sich nach `s(t) = 3t^2` (s in m, t in s). Wie groß ist die **momentane Geschwindigkeit** zum Zeitpunkt t = 5?
  loesung: '30'
  aus_term:
    term: 3x^2
    groesse: ableitung
    x: 5
  einheit: m/s
  tipps:
  - Momentangeschwindigkeit = Ableitung s′(t).
  - '`s′(t) = 6t`. Setz t = 5 ein.'
  fehler:
  - antwort: '15'
    hinweis: Das ist die mittlere Geschwindigkeit seit dem Start, nicht die momentane.
