- id: E1.4-001
  typ: zahl
  stufe: 1
  frage: Ein Körper bewegt sich nach `s(t) = 5t^2` (s in Metern, t in Sekunden). Wie groß ist die **mittlere Geschwindigkeit** zwischen t = 0 und t = 1?
  loesung: '5'
  aus_term:
    term: 5x^2
    groesse: steigung_mittel
    von: 0
    bis: 1
  einheit: m/s
  tipps:
  - 'Mittlere Geschwindigkeit = zurückgelegter Weg : Zeit = (s(b) − s(a)) : (b − a).'
  fehler: []
