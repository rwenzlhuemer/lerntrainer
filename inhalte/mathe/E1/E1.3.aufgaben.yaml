- id: E1.3-001
  typ: zahl
  stufe: 1
  frage: Im Bild siehst du den Graphen von f und die **Tangente** im markierten Punkt. Lies die Steigung der Tangente ab – das ist die momentane Änderungsrate f′ an dieser Stelle.
  loesung: '3'
  aus_term:
    term: 0,25x^2 + 2x - 2
    groesse: ableitung
    x: 2
  graph:
    x:
    - -2
    - 6
    y:
    - -3
    - 9
    kurven:
    - term: 0,25x^2 + 2x - 2
      name: f
    - term: 3x - 3
      name: t
    punkte:
    - x: 2
      y: 3
      auf: 0
  tipps:
  - 'Steigungsdreieck an der Tangente (nicht am Graphen!): eine Einheit nach rechts – wie viel nach oben oder unten?'
  - Fällt die Tangente, ist die Steigung negativ.
  fehler:
  - antwort: '-3'
    hinweis: 'Vorzeichen: Fällt die Tangente von links nach rechts, ist die Steigung negativ.'
