- id: F4.3-001
  typ: zahl
  stufe: 1
  frage: X ist normalverteilt mit μ = 250 und σ = 10. Wie viel Prozent der Werte liegen ungefähr zwischen 230 und 270? (auf eine Nachkommastelle)
