- id: C1.1-001
  typ: auswahl
  stufe: 1
  frage: Ist diese Zuordnung x → y eine Funktion?
  optionen: &id001
  - Ja, das ist eine Funktion.
  - Nein, das ist keine Funktion.
  richtig:
  - 0
  tabelle:
    kopf:
    - x
    - y
    zeilen:
    - - '-2'
      - '7'
    - - '1'
      - '8'
    - - '6'
      - '5'
    - - '8'
      - '-4'
  pruefung:
    art: funktion
  erklaerung: 'Jedem x-Wert ist **genau ein** y-Wert zugeordnet – also eine Funktion. '
  tipps:
  - Bei einer Funktion gehört zu **jedem** x **genau ein** y.
  - Kommt ein x-Wert zweimal vor? Mit demselben oder einem anderen y?
