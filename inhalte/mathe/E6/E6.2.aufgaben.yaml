- id: E6.2-016
  typ: quadratisch
  stufe: 4
  frage: Kosten `K(x) = 0,2x^2 + 34x + 300`, Erlös `E(x) = 50x`. Bei welchen Stückzahlen ist der Gewinn genau 0 (Gewinngrenzen, Break-even)?
  gleichung: 50x = 0,2x^2 + 34x + 300
  loesung: 50; 30
  weg:
  - -0,2x^2 + 16x - 300 = 0
  - x = 50 oder x = 30
  tipps:
  - Gewinn 0 heißt Erlös = Kosten.
  - Alles auf eine Seite und mit der Lösungsformel lösen.
