- id: E6.2-011
  typ: zahl
  stufe: 3
  frage: Kosten `K(x) = 0,5x^2 + 10x + 200`, Erlös `E(x) = 80x`. Wie groß ist der **Gewinn** bei x = 20 Stück?
  loesung: '1000'
  aus_term:
    term: -0,5x^2 + 70x - 200
    groesse: wert
    x: 20
  einheit: €
  tipps:
  - 'Gewinn = Erlös − Kosten: `G(x) = E(x) − K(x)`.'
  - '`G(20) = 80·20 − K(20)`.'
  fehler:
  - antwort: '-1000'
    hinweis: Erlös minus Kosten – nicht umgekehrt.
