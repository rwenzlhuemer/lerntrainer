id: D3.3
titel: Rechnen mit Vektoren
ziel: Du addierst Vektoren und multiplizierst sie mit Zahlen.
erklaerung: '- **Addition:** koordinatenweise. Geometrisch: Pfeile aneinanderhängen.

  - **Multiplikation mit einer Zahl k:** jede Koordinate mal k. Der Pfeil wird k-mal so lang (bei k < 0 umgedreht).

  - Subtraktion: koordinatenweise abziehen.'
beispiel:
  text: 2 · (1 | 3) + (−4 | 1) = (2 | 6) + (−4 | 1) = (−2 | 7).
  wert: '-2'
  weg:
  - 2·1 + (-4) = -2 | erste Koordinate
