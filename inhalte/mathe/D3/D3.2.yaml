id: D3.2
titel: Punkte und Pfeile
ziel: Du berechnest den Vektor von einem Punkt zu einem anderen.
erklaerung: 'Der Vektor von A nach B ist **AB = B − A** („Spitze minus Schaft“).


  Du rechnest Koordinate für Koordinate. Ein Vektor beschreibt eine Verschiebung: wie weit nach rechts (x), nach oben (y) und gegebenenfalls nach vorne (z).'
beispiel:
  text: 'A(1 | 2), B(4 | −1): AB = (4 − 1 | −1 − 2) = (3 | −3).'
  wert: '3'
  weg:
  - 4 - 1 = 3 | erste Koordinate
