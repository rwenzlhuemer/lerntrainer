id: A2.4
titel: Brüche multiplizieren und dividieren
ziel: Du multiplizierst und dividierst Brüche und kürzt geschickt.
erklaerung: |
  **Multiplizieren** ist bei Brüchen einfacher als Addieren:
  Zähler mal Zähler, Nenner mal Nenner. Ein gemeinsamer Nenner ist **nicht** nötig.
  `2/3 · 4/5 = 8/15`

  Eine ganze Zahl schreibst du als Bruch mit Nenner 1: `3 · 2/7 = 3/1 · 2/7 = 6/7`.

  **Dividieren** durch einen Bruch heißt: mit dem **Kehrwert** multiplizieren. Den Kehrwert bekommst du,
  wenn du den Bruch umdrehst: Der Kehrwert von `2/5` ist `5/2`.
  `3/4 : 2/5 = 3/4 · 5/2 = 15/8`

  Tipp: Kürze schon **vor** dem Ausrechnen über Kreuz – dann bleiben die Zahlen klein.
  Bei Vorzeichen gilt wie immer: Minus mal Minus ergibt Plus.
beispiel:
  wert: "5/6"
  text: |
    `5/9 : 2/3` – den zweiten Bruch umdrehen und multiplizieren. Vor dem Ausrechnen kürzen: 3 und 9 durch 3.
  weg:
    - "5/9 : 2/3 = 5/9 · 3/2 | mit dem Kehrwert multiplizieren"
    - "5/9 · 3/2 = 15/18 | Zähler mal Zähler, Nenner mal Nenner"
    - "15/18 = 5/6 | gekürzt durch 3"
