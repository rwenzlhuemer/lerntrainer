- id: C5.1-013
  typ: zahl
  stufe: 3
  frage: Eine Exponentialfunktion hat `f(0) = 80` und `f(1) = 120`. Wie groß ist der Faktor b?
  loesung: 1,5
  rechnung: 120/80
  tipps:
  - Bei `f(x) = a·bˣ` ist f(0) = a. Pro Schritt wird mit b multipliziert.
  - '`b = f(1) : f(0) = 120 : 80`'
  fehler:
  - antwort: '40'
    hinweis: 'Das ist die Zunahme (Differenz). Gesucht ist der Faktor: dividieren.'
  - antwort: 2/3
    hinweis: f(1) **durch** f(0).
