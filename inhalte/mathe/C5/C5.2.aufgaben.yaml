  frage: Ein Wert nimmt pro Jahr um 15 % zu. Mit welchem Faktor b wird jedes Jahr multipliziert?
  loesung: 1,15
  rechnung: 1 + 15/100
  tipps:
  - Zunahme um p % → b = 1 + p/100; Abnahme → b = 1 − p/100.
  fehler:
  - antwort: 3/20
    hinweis: Das ist nur die Änderung, nicht der Faktor.
  - antwort: 17/20
    hinweis: Zunahme heißt plus, Abnahme minus.
