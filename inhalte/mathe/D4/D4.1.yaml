id: D4.1
titel: Parameterdarstellung einer Geraden
ziel: Du beschreibst Geraden mit Stütz- und Richtungsvektor.
erklaerung: '**g: X = A + t · d**

  - A ist ein Punkt der Geraden (Stützvektor),

  - d ist ein Richtungsvektor (z. B. AB),

  - für jede Zahl t bekommst du einen anderen Punkt der Geraden.


  So funktioniert das in ℝ² und ℝ³ gleich.'
beispiel:
  text: 'Durch A(1 | 2) und B(3 | 6): d = (2 | 4). Für t = 2: X = (1 | 2) + 2·(2 | 4) = (5 | 10).'
  wert: '5'
  weg:
  - 1 + 2·2 = 5 | erste Koordinate
