- id: C2.1-001
  typ: zahl
  stufe: 1
  frage: '`f(x) = x + 4`. Wie groß ist **k**?'
  loesung: '1'
  aus_term:
    term: x + 4
    groesse: k
  tipps:
  - In `f(x) = k·x + d` ist **k** die Zahl vor dem x (Steigung) und **d** die Zahl ohne x (Schnittpunkt mit der y-Achse).
  - Steht die Gleichung nicht in der Form k·x + d, forme sie zuerst um (Klammer auflösen, Bruch aufteilen).
  - Das Vorzeichen gehört dazu!
  fehler:
  - antwort: '4'
    hinweis: Das ist d, die Zahl **ohne** x.
