- id: C2.2-001
  typ: zahl
  stufe: 1
  frage: Lies aus dem Graphen die Steigung **k** ab (Steigungsdreieck zwischen A und B).
  loesung: '-2'
  aus_term:
    term: -2x + 2
    groesse: k
  graph:
    x:
    - -5
    - 5
    y:
    - -7
    - 7
    kurven:
    - term: -2x + 2
      name: f
    punkte:
    - x: 0
      y: 2
      name: A
      auf: 0
    - x: 1
      y: 0
      name: B
      auf: 0
  tipps:
  - 'Steigungsdreieck: Geh von A aus waagrecht nach rechts bis unter/über B, dann senkrecht zu B.'
  - '`k = (Höhenunterschied) : (waagrechter Weg)`. Geht es nach unten, ist k negativ.'
  - Waagrecht sind es 1 Einheiten.
  fehler:
  - antwort: '2'
    hinweis: 'Achte auf das Vorzeichen: Fällt die Gerade (von links nach rechts), ist k negativ.'
  - antwort: -0,5
    hinweis: 'Umgekehrt: Höhe **durch** Breite, nicht Breite durch Höhe.'
