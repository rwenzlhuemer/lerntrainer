id: E3.3
titel: "Extremstellen berechnen"
ziel: Du berechnest Hoch- und Tiefpunkte mit der Ableitung.
erklaerung: |
  1. **f′(x) = 0** setzen und lösen – das sind die möglichen Extremstellen.
  2. **Entscheiden** mit f″: `f″ < 0 → Hochpunkt, `f″ > 0 → Tiefpunkt.
     (Oder: Wechselt f′ von + nach −, ist es ein Hochpunkt.)
  3. **y-Koordinate**: x in **f** einsetzen (nicht in f′!).
beispiel:
  wert: "2"
  text: |
    `f(x) = x³ - 3x: `f′(x) = 3x² - 3 = 0 → x = ±1. `f″(x) = 6x: f″(−1) < 0 → Hochpunkt bei x = −1, f(−1) = 2.
  weg:
    - "(-1)^3 - 3·(-1) = 2"

