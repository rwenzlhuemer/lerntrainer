- id: E3.4-001
  typ: auswahl
  stufe: 1
  frage: '`f(x) = x^3 - 2x^2 - x - 3`. Ist der Graph an der Stelle x = 1 links- oder rechtsgekrümmt?'
  optionen:
  - linksgekrümmt (f″ > 0)
  - rechtsgekrümmt (f″ < 0)
  richtig:
  - 0
  pruefung:
    art: kruemmung
    term: x^3 - 2x^2 - x - 3
    x: 1
  erklaerung: '`f″(x) = 6x - 4`, also `f″(1) = 2`. Positiv: linksgekrümmt (wie ein lächelnder Mund).'
  tipps:
  - Zweimal ableiten, dann x einsetzen.
  - 'f″ > 0: linksgekrümmt, f″ < 0: rechtsgekrümmt.'
