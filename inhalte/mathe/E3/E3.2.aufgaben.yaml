- id: E3.2-001
  typ: auswahl
  stufe: 1
  frage: '`f(x) = 4x^2 - x + 1`. Wie verhält sich f an der Stelle x = -3?'
  optionen:
  - streng monoton steigend (f′ > 0)
  - streng monoton fallend (f′ < 0)
  - waagrechte Tangente (f′ = 0)
  richtig:
  - 1
  pruefung:
    art: ableitung_vorzeichen
    term: 4x^2 - x + 1
    x: -3
  erklaerung: '`f′(-3) = -25`. Negativ – f fällt dort.'
  tipps:
  - Berechne f′ und setz x ein.
  - 'f′ > 0: steigend, f′ < 0: fallend.'
