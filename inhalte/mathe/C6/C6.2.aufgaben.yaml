- id: C6.2-001
  typ: zahl
  stufe: 1
  frage: 'Lies am Graphen ab: Wie lautet die **x-Koordinate** des **Hochpunkts**?'
  loesung: '0'
  aus_term:
    term: 2x^3 - 6x^2 + 4
    groesse: hochpunkt_x
  graph:
    x:
    - -3
    - 5
    y:
    - -7
    - 7
    kurven:
    - term: 2x^3 - 6x^2 + 4
      name: f
  tipps:
  - Der Hochpunkt ist der höchste Punkt in seiner Umgebung (ein „Gipfel“), der Tiefpunkt ein „Tal“.
  - 'Gesucht ist die x-Koordinate: auf der waagrechten Achse ablesen.'
  fehler:
  - antwort: '2'
    hinweis: Verwechselt? Hochpunkt = Gipfel, Tiefpunkt = Tal.
