- id: C6.6-001
  typ: auswahl
  stufe: 1
  frage: Welcher Funktionstyp ist `f(x) = 0,5x + 1`?
  optionen: &id001
  - linear
  - quadratisch
  - Polynomfunktion vom Grad 3 oder höher
  - exponentiell
  - Potenzfunktion (z. B. a/x, √x)
  richtig:
  - 0
  pruefung:
    art: funktionstyp
    term: 0,5x + 1
  erklaerung: 'Höchste Hochzahl 1 – eine Gerade: linear.'
  tipps:
  - Wo steht das x? In der Hochzahl → exponentiell; im Nenner oder unter der Wurzel → Potenzfunktion.
  - 'Sonst: Was ist die höchste Hochzahl von x?'
