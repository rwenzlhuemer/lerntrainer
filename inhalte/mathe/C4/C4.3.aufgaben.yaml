- id: C4.3-016
  typ: zahl
  stufe: 4
  frage: '`f(x) = a/x`. Mit welchem Faktor ändert sich f(x), wenn x gedrittelt wird?'
  loesung: '3'
  formel_faktor:
    formel: y = a/x
    ziel: y
    aenderung:
      x: 1/3
  tipps:
  - Setz statt x jetzt 1/3·x ein.
  - 'Indirekt proportional: doppelt so viel → halb so viel, halb so viel → doppelt so viel.'
  fehler:
  - antwort: 1/3
    hinweis: 'Indirekt proportional: Wird x größer, wird f(x) **kleiner** – und umgekehrt.'
