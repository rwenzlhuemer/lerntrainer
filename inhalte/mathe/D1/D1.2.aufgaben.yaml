- id: D1.2-001
  typ: zahl
  stufe: 1
  frage: Berechne sin α im abgebildeten Dreieck (als Bruch oder Dezimalzahl).
  loesung: 0,6
  dreieck:
    a: 6
    b: 8
    c: 10
  dreieck_rechnen:
    gegeben:
      a: 6
      b: 8
    gesucht: sin_alpha
  tipps:
  - 'sin α = Gegenkathete : Hypotenuse, cos α = Ankathete : Hypotenuse, tan α = Gegenkathete : Ankathete.'
  - Gegenkathete von α ist a (liegt gegenüber), Ankathete ist b (liegt an α an), Hypotenuse ist c.
  fehler:
  - antwort: 0,8
    hinweis: Gegenkathete und Ankathete verwechselt? Die Gegenkathete liegt dem Winkel **gegenüber**.
