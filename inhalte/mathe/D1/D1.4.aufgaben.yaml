- id: D1.4-011
  typ: zahl
  stufe: 3
  frage: Eine Seilbahn ist 1500 m lang und steigt unter dem Winkel 25° an. Welchen Höhenunterschied überwindet sie? (zwei Nachkommastellen)
  loesung: 633,93
  gerundet: 2
  einheit: m
  dreieck_rechnen:
    gegeben:
      alpha: 25
      c: 1500
    gesucht: a
  tipps:
  - Das Seil ist die Hypotenuse.
  - '`sin 25° = h/1500`.'
  fehler:
  - antwort: 1359,46
    hinweis: 'Das ist die waagrechte Strecke (cos). Für die Höhe: sin.'
