- id: D1.4-001
  typ: zahl
  stufe: 1
  frage: Aus 40 m Entfernung sieht man die Spitze eines Baumes unter einem Höhenwinkel von 50°. Wie hoch ist der Baum (Augenhöhe vernachlässigt)? (zwei Nachkommastellen)
  loesung: 47,67
  gerundet: 2
  einheit: m
  dreieck_rechnen:
    gegeben:
      alpha: 50
      b: 40
    gesucht: a
  tipps:
  - Entfernung = Ankathete, Höhe = Gegenkathete.
  - '`tan 50° = h/40`.'
  fehler: []
