  - Bring zuerst alle x auf eine Seite und alle Zahlen auf die andere.
  - Rechne auf beiden Seiten +2x. Dann ist rechts kein x mehr.
  - Danach steht da x - 4 = 4. Das löst du wie vorher in zwei Schritten.
  fehler:
  - antwort: -8/3
    hinweis: 'Beim Hinüberbringen von -2x: Auf der anderen Seite wird daraus +2x, nicht −2x.'
  - antwort: '0'
    hinweis: Achtung beim Wegbringen der Zahl links – das Vorzeichen dreht sich um.
