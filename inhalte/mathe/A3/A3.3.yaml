id: A3.3
titel: Negative Hochzahlen und Gleitkommadarstellung
ziel: Du rechnest mit negativen Hochzahlen und schreibst sehr große und kleine Zahlen in Gleitkommadarstellung.
erklaerung: |
  Eine **negative Hochzahl** bedeutet „1 durch …“: `2^-3 = 1/2^3 = 1/8`.
  Sie macht die Zahl **nicht** negativ! Bei Brüchen: umdrehen, `(2/3)^-2 = (3/2)^2 = 9/4`.

  **Zehnerpotenzen:** `10^4 = 10 000`, `10^-3 = 0,001`.

  **Gleitkommadarstellung:** eine Zahl zwischen 1 und 10, mal einer Zehnerpotenz.
  - `24 000 = 2,4 · 10^4` (Komma 4 Stellen nach links → Hochzahl +4)
  - `0,00066 = 6,6 · 10^-4` (Komma 4 Stellen nach rechts → Hochzahl -4)

  Beim Multiplizieren rechnest du die Zahlen und die Zehnerpotenzen getrennt.
beispiel:
  wert: "6·10^-2"
  text: |
    `3 · 2 = 6` und `10^4 · 10^-6 = 10^-2`.
  weg:
    - "(3·10^4) · (2·10^-6) = 6·10^-2"
