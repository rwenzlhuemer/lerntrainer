- id: E2.4-001
  typ: term
  stufe: 1
  frage: 'Leite ab: `f(x) = sin(x)`. Gib `f′(x)` an.'
  form: frei
  loesung: cos(x)
  ableitung_von: sin(x)
  tipps:
  - '`(sin x)′ = cos x`, `(cos x)′ = −sin x`, `(eˣ)′ = eˣ`.'
  - 'Steht innen k·x, kommt der Faktor k nach vorne: `[f(kx)]′ = k · f′(kx)`.'
  fehler:
  - antwort: -cos(x)
    hinweis: 'Prüf die Regel: Vorzeichen bei cos, und der innere Faktor k kommt nach vorne.'
