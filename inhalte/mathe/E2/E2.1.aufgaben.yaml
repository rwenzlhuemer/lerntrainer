- id: E2.1-001
  typ: term
  stufe: 1
  frage: 'Leite ab: `f(x) = x^5`. Gib `f′(x)` an.'
  form: frei
  loesung: 5x^4
  ableitung_von: x^5
  tipps:
  - 'Potenzregel: `(xⁿ)′ = n · xⁿ⁻¹` – die Hochzahl kommt nach vorne, die neue Hochzahl ist um 1 kleiner.'
  fehler:
  - antwort: x^4
    hinweis: Die alte Hochzahl kommt als Faktor nach vorne.
  - antwort: 5x^5
    hinweis: Die Hochzahl wird um 1 kleiner.
