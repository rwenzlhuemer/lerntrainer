- id: E2.1-019
  typ: term
  stufe: 4
  frage: 'Leite ab: `f(x) = x^(1/3)`. Gib `f′(x)` an.'
  form: frei
  loesung: 1/(3x^(2/3))
  ableitung_von: x^(1/3)
  tipps:
  - 'Wurzel als Potenz: `√x = x^(1/2)`.'
  - 'Potenzregel: `(xⁿ)′ = n · xⁿ⁻¹` – die Hochzahl kommt nach vorne, die neue Hochzahl ist um 1 kleiner.'
  - '`1/2 − 1 = −1/2`, und `x^(-1/2) = 1/√x`.'
  fehler:
  - antwort: x^(1/3)/3
    hinweis: 'Potenzregel: Hochzahl nach vorne, neue Hochzahl um 1 kleiner (bei √x wird sie negativ).'
