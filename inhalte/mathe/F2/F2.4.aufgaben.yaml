- id: F2.4-001
  typ: zahl
  stufe: 1
  frage: In einer Urne sind 3 rote und 3 blaue Kugeln. Es werden 2 Kugeln mit Zurücklegen gezogen. Wie groß ist die Wahrscheinlichkeit für **zwei gleiche Farben**? (Bruch oder Dezimalzahl)
  loesung: 0,5
  gerundet: 4
  urne:
    kugeln:
      r: 3
      b: 3
    zuege: 2
    zuruecklegen: true
    bedingung: zug in ('rr', 'bb')
  tipps:
  - Zeichne ein Baumdiagramm.
  - Entlang eines Pfades wird **multipliziert** (Pfadregel), passende Pfade werden **addiert**.
  - Mit Zurücklegen bleiben die Wahrscheinlichkeiten gleich.
  fehler: []
