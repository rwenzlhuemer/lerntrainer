- id: F2.3-001
  typ: zahl
  stufe: 1
  frage: Ein Würfel wird geworfen. Wie groß ist die Wahrscheinlichkeit für eine **Sechs**? (als Bruch oder Dezimalzahl)
  loesung: 1/6
