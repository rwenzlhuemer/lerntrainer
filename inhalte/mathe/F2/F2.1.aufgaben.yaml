- id: F2.1-011
  typ: zahl
  stufe: 3
  frage: Die Wahrscheinlichkeit für ein Ereignis E ist P(E) = 0,7. Wie groß ist die Wahrscheinlichkeit des **Gegenereignisses** ¬E?
  loesung: 0,3
  rechnung: 1 - 0,7
  tipps:
  - Ereignis und Gegenereignis ergeben zusammen 1.
  - P(¬E) = 1 − P(E).
  fehler:
  - antwort: 7/10
    hinweis: Das ist P(E). Gesucht ist 1 − P(E).
