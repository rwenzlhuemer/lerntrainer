- id: E4.1-001
  typ: auswahl
  stufe: 1
  frage: Abgebildet ist der Graph von f. Welcher Term gehört zur **Ableitung f′**?
  mathe: true
  optionen:
  - 2x
  - -x^2 + 2
  - -2x
  richtig:
  - 2
  pruefung:
    art: termgleich
    ziel: -2x
  graph:
    x:
    - -4
    - 4
    y:
    - -9
    - 9
    kurven:
    - term: -x^2 + 2
      name: f
  erklaerung: Wo f steigt, ist f′ positiv; wo f fällt, negativ; an Hoch- und Tiefpunkten ist f′ = 0. Hier passt `-2x`.
  tipps:
  - Wo hat f einen Hoch- oder Tiefpunkt? Dort muss f′ null sein.
  - Steigt f ganz links? Dann muss f′ dort positiv sein.
