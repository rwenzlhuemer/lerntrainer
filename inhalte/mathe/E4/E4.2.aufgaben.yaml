- id: E4.2-001
  typ: zahl
  stufe: 1
  frage: Abgebildet ist der Graph der **Ableitung f′**. An welcher Stelle hat f einen **Tiefpunkt**?
  loesung: '-3'
  aus_term:
    term: -x^2 - x + 6
    groesse: vzw_minus_plus
  graph:
    x:
    - -5
    - 5
    y:
    - -6
    - 6
    kurven:
    - term: -x^2 - x + 6
      name: f′
  tipps:
  - f hat eine Extremstelle, wo f′ die x-Achse schneidet (f′ = 0).
  - 'Hochpunkt: f′ wechselt von + nach − (der Graph von f′ geht von oben nach unten durch die x-Achse). Tiefpunkt: von − nach +.'
  fehler:
  - antwort: '2'
    hinweis: 'Prüf den Vorzeichenwechsel: Hochpunkt von f heißt f′ wechselt von plus nach minus.'
