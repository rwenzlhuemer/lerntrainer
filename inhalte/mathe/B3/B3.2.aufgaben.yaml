  - 'Du formst wie bei einer Gleichung um: x-Glieder auf eine Seite, Zahlen auf die andere.'
  - '**Einzige Ausnahme:** Multiplizierst oder dividierst du mit einer **negativen** Zahl, dreht sich das Zeichen um (aus < wird >).'
  - 'Als Intervall: `x < 3` ist `]-∞; 3[`, `x ≥ 2` ist `[2; ∞[`. Die eckige Klammer zeigt nach außen, wenn die Zahl **nicht** dazugehört.'
