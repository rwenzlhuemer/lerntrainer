- id: B3.2-009
  typ: auswahl
  stufe: 2
  frage: Welches Intervall beschreibt alle Zahlen mit `x > -5`?
  optionen:
  - ']-∞; -5['
  - '[-5; ∞['
  - ']-5; ∞['
  richtig:
  - 2
  pruefung:
    art: intervall
    ziel: x > -5
  erklaerung: 'Die Klammer zeigt, ob die Grenze dazugehört: `[` bzw. `]` nach innen = gehört dazu (≤, ≥); nach außen gedreht = gehört nicht dazu (<, >). Bei ∞ ist die Klammer immer offen.'
  tipps:
  - 'Zeichne dir die Zahlengerade: Liegen die Lösungen links oder rechts der Grenze?'
  - Gehört die Grenze selbst dazu (≤, ≥) oder nicht (<, >)?
