  frage: Welches Intervall beschreibt alle Zahlen mit `x ≤ 3`?
  optionen:
  - ']-∞; 3['
  - '[3; ∞['
  - ']-∞; 3]'
  richtig:
  - 2
  pruefung:
    art: intervall
    ziel: x ≤ 3
  erklaerung: 'Die Klammer zeigt, ob die Grenze dazugehört: `[` bzw. `]` nach innen = gehört dazu (≤, ≥); nach außen gedreht = gehört nicht dazu (<, >). Bei ∞ ist die Klammer immer offen.'
  tipps:
  - 'Zeichne dir die Zahlengerade: Liegen die Lösungen links oder rechts der Grenze?'
  - Gehört die Grenze selbst dazu (≤, ≥) oder nicht (<, >)?
- id: B3.2-031
  typ: ungleichung
  stufe: 4
  ungleichung: -4x - 9 > -2x + 5
  form: intervall
  loesung: x < -7
  weg:
  - -4x - 9 > -2x + 5
  - -2x - 9 > 5 | +2x
  - -2x > 14 | +9
  - x < -7 | :(-2) – Zeichen umdrehen!
  tipps:
  - 'Du formst wie bei einer Gleichung um: x-Glieder auf eine Seite, Zahlen auf die andere.'
  - '**Einzige Ausnahme:** Multiplizierst oder dividierst du mit einer **negativen** Zahl, dreht sich das Zeichen um (aus < wird >).'
  - 'Als Intervall: `x < 3` ist `]-∞; 3[`, `x ≥ 2` ist `[2; ∞[`. Die eckige Klammer zeigt nach außen, wenn die Zahl **nicht** dazugehört.'
  fehler:
  - antwort: x > -7
    hinweis: Beim Multiplizieren oder Dividieren mit einer **negativen** Zahl dreht sich das Ungleichheitszeichen um!
